name: Build ARDEN VST3 for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE and VST3
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Compile VST3
        run: cmake --build build --config Release --target Arden_VST3 --parallel 2
      - name: Locate VST3 package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter '*.vst3' -Recurse -Directory | Select-Object -First 1
          if (-not $plugin) { throw 'No .vst3 package was generated.' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Path $plugin.FullName -Destination package -Recurse
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: ARDEN-Windows-VST3
          path: package/
          if-no-files-found: error
